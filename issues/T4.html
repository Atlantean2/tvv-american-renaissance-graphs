<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TechVestVentures American Renaissance Graphs — T4</title><link rel="stylesheet" href="../assets/style.css"><script>if(!/[?&]raw/.test(location.search))location.replace("../index.html#T4")</script></head><body><main id="issue"><h2 class="desk">4. Manufacturing Output and Recessions</h2><figure class="g"><img src="img/17.webp" alt="Industrial production" loading="lazy"><figcaption><span class="t">Industrial production</span><p>Manufacturing output index 99.4 (Sep 2026), below the 2007 high 106.6. Federal Reserve G.17.</p><p><i>Data | Data date: 2026-09</i></p><ul><li>Dec 2007: manufacturing output high 106.6 (Data) <a href="https://fred.stlouisfed.org/series/IPMAN">https://fred.stlouisfed.org/series/IPMAN</a></li><li>Apr 2020: COVID low 79.9 (Data) <a href="https://fred.stlouisfed.org/series/IPMAN">https://fred.stlouisfed.org/series/IPMAN</a></li><li>Sep 2026: 99.4, still below the 2007 high (Data) <a href="https://fred.stlouisfed.org/series/IPMAN">https://fred.stlouisfed.org/series/IPMAN</a></li></ul><p>Sources: <a href="https://fred.stlouisfed.org/series/IPMAN">https://fred.stlouisfed.org/series/IPMAN</a> <a href="https://fred.stlouisfed.org/series/INDPRO">https://fred.stlouisfed.org/series/INDPRO</a></p></figcaption></figure>
<figure class="g"><img src="img/28.webp" alt="Manufacturing output 2007-2011, Great Recession annotated" loading="lazy"><figcaption><span class="t">Manufacturing output 2007-2011, Great Recession annotated</span><p>Great Recession: demand and credit collapse; output −20.8% Dec 2007–Jun 2009, never fully regained. Fed G.17.</p><ul><li>Verdict: demand-driven credit and banking collapse; oil spike was a brief cost squeeze (Interpretation).</li><li>Output −20.8%: Dec 2007 106.6 → Jun 2009 84.4 (18 months); old peak never regained, latest 99.4 Sep 2026 (Data) <a href="https://fred.stlouisfed.org/series/IPMAN">https://fred.stlouisfed.org/series/IPMAN</a></li><li>Mar 16, 2008: Bear Stearns rescued <a href="https://www.federalreservehistory.org/essays/bear-stearns-collapse">https://www.federalreservehistory.org/essays/bear-stearns-collapse</a></li><li>Jul 2008: WTI ~$145 (Jul 3 close); IndyMac fails Jul 11 <a href="https://fred.stlouisfed.org/series/DCOILWTICO">https://fred.stlouisfed.org/series/DCOILWTICO</a> <a href="https://www.fdic.gov/resources/resolutions/bank-failures/in-brief/2008">https://www.fdic.gov/resources/resolutions/bank-failures/in-brief/2008</a></li><li>Sep 2008: Lehman (Sep 15) and WaMu (Sep 25) fail <a href="https://www.federalreservehistory.org/essays/great-recession-of-200709">https://www.federalreservehistory.org/essays/great-recession-of-200709</a> <a href="https://www.fdic.gov/resources/resolutions/bank-failures/failed-bank-list/wamu-settlement.html">https://www.fdic.gov/resources/resolutions/bank-failures/failed-bank-list/wamu-settlement.html</a></li><li>Oct 3, 2008: TARP $700B <a href="https://home.treasury.gov/data/troubled-assets-relief-program">https://home.treasury.gov/data/troubled-assets-relief-program</a></li><li>Nov 25, 2008: QE1 <a href="https://www.federalreserve.gov/newsevents/pressreleases/monetary20081125b.htm">https://www.federalreserve.gov/newsevents/pressreleases/monetary20081125b.htm</a></li><li>Dec 2008: Fed funds to 0–0.25% (Dec 16); GM/Chrysler loans (Dec 19) <a href="https://www.federalreserve.gov/newsevents/pressreleases/monetary20081216b.htm">https://www.federalreserve.gov/newsevents/pressreleases/monetary20081216b.htm</a> <a href="https://home.treasury.gov/data/troubled-assets-relief-program/automotive-programs">https://home.treasury.gov/data/troubled-assets-relief-program/automotive-programs</a></li><li>Rates/inflation: fed funds 5.26% (Jul 2007) → 0.16% (Dec 2008); CPI 5.5% (Jul 2008) → −1.2% (Jun 2009) (Data) <a href="https://fred.stlouisfed.org/series/FEDFUNDS">https://fred.stlouisfed.org/series/FEDFUNDS</a> <a href="https://fred.stlouisfed.org/series/CPIAUCSL">https://fred.stlouisfed.org/series/CPIAUCSL</a></li></ul></figcaption></figure>
<figure class="g"><img src="img/29.webp" alt="Manufacturing output 2019-2022, COVID annotated" loading="lazy"><figcaption><span class="t">Manufacturing output 2019-2022, COVID annotated</span><p>COVID: supply shutdown; output −19.2% Feb–Apr 2020, Feb-2020 level regained Jul 2021. Fed G.17.</p><ul><li>Verdict: supply shock first (plant shutdowns), then a stimulus-led demand rebound held back by 2021 chip shortages (Interpretation).</li><li>Output −19.2% in 2 months: Feb 2020 98.8 → Apr 2020 79.9; Feb level regained Jul 2021 (Data) <a href="https://fred.stlouisfed.org/series/IPMAN">https://fred.stlouisfed.org/series/IPMAN</a></li><li>Mar 2020: Fed to zero plus QE (Mar 15); Fed facilities amid dash for cash (Mar 23) <a href="https://www.federalreserve.gov/newsevents/pressreleases/monetary20200315a.htm">https://www.federalreserve.gov/newsevents/pressreleases/monetary20200315a.htm</a> <a href="https://www.federalreserve.gov/newsevents/pressreleases/monetary20200323b.htm">https://www.federalreserve.gov/newsevents/pressreleases/monetary20200323b.htm</a></li><li>Mar 27, 2020: CARES Act $2.2T with PPP <a href="https://home.treasury.gov/policy-issues/cares">https://home.treasury.gov/policy-issues/cares</a></li><li>Apr 9, 2020: Main Street lending <a href="https://www.federalreserve.gov/newsevents/pressreleases/monetary20200409a.htm">https://www.federalreserve.gov/newsevents/pressreleases/monetary20200409a.htm</a></li><li>Apr 2020: manufacturing −13.7%, autos down more than 70% <a href="https://www.federalreserve.gov/releases/g17/20200515/">https://www.federalreserve.gov/releases/g17/20200515/</a></li><li>2021: semiconductor shortages hold down vehicle output <a href="https://www.federalreserve.gov/releases/g17/20210415/">https://www.federalreserve.gov/releases/g17/20210415/</a></li><li>Rates/inflation: fed funds 1.55% (Dec 2019) → 0.05% (Apr 2020); hikes from Mar 2022; CPI 9.0% Jun 2022 (Data) <a href="https://fred.stlouisfed.org/series/FEDFUNDS">https://fred.stlouisfed.org/series/FEDFUNDS</a> <a href="https://fred.stlouisfed.org/series/CPIAUCSL">https://fred.stlouisfed.org/series/CPIAUCSL</a></li></ul></figcaption></figure>
<figure class="g"><img src="img/22.webp" alt="Manufacturing productivity" loading="lazy"><figcaption><span class="t">Manufacturing productivity</span><p>Manufacturing output per hour 100.4 (Q2 2026, 2017=100), below its 103.4 pre-2015 high. BLS via FRED.</p><p><i>Data | Data date: 2026-04</i></p><ul><li>Pre-2015 high: output per hour 103.4 (Data) <a href="https://fred.stlouisfed.org/series/OPHMFG">https://fred.stlouisfed.org/series/OPHMFG</a></li><li>Q2 2026: 100.4, 2017=100 (Data) <a href="https://fred.stlouisfed.org/series/OPHMFG">https://fred.stlouisfed.org/series/OPHMFG</a></li><li>Output itself still below 2007 high (Data) <a href="https://fred.stlouisfed.org/series/OUTMS">https://fred.stlouisfed.org/series/OUTMS</a></li></ul><p>Sources: <a href="https://fred.stlouisfed.org/series/OPHMFG">https://fred.stlouisfed.org/series/OPHMFG</a> <a href="https://fred.stlouisfed.org/series/OUTMS">https://fred.stlouisfed.org/series/OUTMS</a></p></figcaption></figure></main></body></html>
