<figure class="g"><img src="img/12.webp" alt="Foreign-government pledges" loading="lazy"><figcaption><span class="t">Foreign-government pledges</span><p>Nine country pledges total $5.77T: UAE $1.4T, Qatar $1.2T, Japan $1T. Announcements, not realized. WH, Oct 2026.</p><p><i>Announced | Data date: 2026-10-23</i></p><p>Sources: <a href="https://www.whitehouse.gov/investments/">https://www.whitehouse.gov/investments/</a> <a href="https://www.whitehouse.gov/releases/2026/03/trump-effect-a-running-list-of-new-u-s-investment-in-president-trumps-second-term/">https://www.whitehouse.gov/releases/2026/03/trump-effect-a-running-list-of-new-u-s-investment-in-president-trumps-second-term/</a></p></figcaption></figure>
<figure class="g"><img src="img/26.webp" alt="WH Tracker plus Domestic Pledges vs 19T Claim" loading="lazy"><figcaption><span class="t">WH Tracker plus Domestic Pledges vs 19T Claim</span><p>WH tracker $11.26T plus $0.30T new domestic pledges reaches $11.56T, $7.44T short of the $19T claim.</p><ul><li>Domestic company pledges $3.19T gross, 23 pledges (Announced) <a href="https://www.whitehouse.gov/investments/">https://www.whitehouse.gov/investments/</a></li><li>Only $295.7B is not already in the WH total (TI, Merck, AbbVie, Gilead, Microsoft US share, Blackstone, Enbridge) (Announced)</li><li>WH $11.26T + $0.30T = $11.56T; $7.44T gap to $19T unexplained (Announced) <a href="https://www.cnn.com/2026/09/03/politics/fact-check-vance-trump-trillions-invested">https://www.cnn.com/2026/09/03/politics/fact-check-vance-trump-trillions-invested</a></li><li>Apple, Meta, Nvidia, Stargate, Micron, IBM, Pfizer, J&amp;J, Lilly pledges already in the WH tracker (Data, parsed Oct 23, 2026)</li></ul></figcaption></figure>
<figure class="g"><img src="img/02.webp" alt="Tracker totals: July vs October 2026" loading="lazy"><figcaption><span class="t">Tracker totals: July vs October 2026</span><p>Tracked announced investment rose from $591.84B (Jul 25) to $1.00T (Oct 21); projects 136 to 265. AFT.</p><p><i>Announced | Data date: 2026-10-21</i></p><p>Sources: <a href="https://americanfactorytracker.com/">https://americanfactorytracker.com/</a> <a href="https://www.youtube.com/watch?v=bf0m2g7GYrI&amp;t=2600s">https://www.youtube.com/watch?v=bf0m2g7GYrI&amp;t=2600s</a></p></figcaption></figure>
<figure class="g"><img src="img/04.webp" alt="Built vs still in the pipeline" loading="lazy"><figcaption><span class="t">Built vs still in the pipeline</span><p>Only $187B (19%) of $1.00T tracked investment is operating; 158 projects still pending. AFT, Oct 21, 2026.</p><p><i>Announced | Data date: 2026-10-21</i></p><p>Sources: <a href="https://americanfactorytracker.com/">https://americanfactorytracker.com/</a></p></figcaption></figure>
