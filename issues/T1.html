f0m2g7GYrI&amp;t=2600s</a></p></figcaption></figure>
<figure class="g"><img src="img/11.webp" alt="White House tracker by sector" loading="lazy"><figcaption><span class="t">White House tracker by sector</span><p>WH tracker: $11.26T in 336 announcements; country deals $5.77T, manufacturing $1.15T. Announced, Oct 23, 2026.</p><p><i>Announced | Data date: 2026-10-23</i></p><ul><li>Oct 23, 2026: 336 announcements, $11.26T (Announced) <a href="https://www.whitehouse.gov/investments/">https://www.whitehouse.gov/investments/</a></li><li>Country and trade deals $5.77T, 51% of total (Announced) <a href="https://www.whitehouse.gov/investments/">https://www.whitehouse.gov/investments/</a></li><li>Manufacturing $1.15T (Announced) <a href="https://www.whitehouse.gov/investments/">https://www.whitehouse.gov/investments/</a></li></ul><p>Sources: <a href="https://www.whitehouse.gov/investments/">https://www.whitehouse.gov/investments/</a> <a href="https://www.whitehouse.gov/releases/2026/03/trump-effect-a-running-list-of-new-u-s-investment-in-president-trumps-second-term/">https://www.whitehouse.gov/releases/2026/03/trump-effect-a-running-list-of-new-u-s-investment-in-president-trumps-second-term/</a></p></figcaption></figure>
<figure class="g"><img src="img/12.webp" alt="Foreign-government pledges" loading="lazy"><figcaption><span class="t">Foreign-government pledges</span><p>Nine country pledges total $5.77T: UAE $1.4T, Qatar $1.2T, Japan $1T. Announcements, not realized. WH, Oct 2026.</p><p><i>Announced | Data date: 2026-10-23</i></p><ul><li>Oct 23, 2026: nine country pledges, $5.77T (Announced) <a href="https://www.whitehouse.gov/investments/">https://www.whitehouse.gov/investments/</a></li><li>UAE $1.4T over 10 years; Qatar $1.2T; Japan $1T (Announced) <a href="https://www.whitehouse.gov/investments/">https://www.whitehouse.gov/investments/</a></li><li>Pledges are multiyear and partly purchases, not FDI (Interpretation) <a href="https://www.whitehouse.gov/investments/">https://www.whitehouse.gov/investments/</a></li></ul><p>Sources: <a href="https://www.whitehouse.gov/investments/">https://www.whitehouse.gov/investments/</a> <a href="https://www.whitehouse.gov/releases/2026/03/trump-effect-a-running-list-of-new-u-s-investment-in-president-trumps-second-term/">https://www.whitehouse.gov/releases/2026/03/trump-effect-a-running-list-of-new-u-s-investment-in-president-trumps-second-term/</a></p></figcaption></figure>

href="https://www.mccormick.senate.gov/news/press-releases/fact-sheet-more-than-90-billion-in-investments-announced-at-senator-mccormicks-pennsylvania-energy-and-innovation-summit/">https://www.mccormick.senate.gov/news/press-releases/fact-sheet-more-than-90-billion-in-investments-announced-at-senator-mccormicks-pennsylvania-energy-and-innovation-summit/</a></li><li>WH $11.26T + $0.30T = $11.56T; $7.44T gap to $19T unexplained (Announced) <a href="https://www.cnn.com/2026/09/03/politics/fact-check-vance-trump-trillions-invested">https://www.cnn.com/2026/09/03/politics/fact-check-vance-trump-trillions-invested</a></li><li>Oct 23, 2026: Apple, Meta, Nvidia, Stargate, Micron, IBM, Pfizer, J&amp;J, Lilly pledges already listed in the WH tracker (Data, TVV parse) <a href="https://www.whitehouse.gov/investments/">https://www.whitehouse.gov/investments/</a></li></ul></figcaption></figure>
<figure class="g"><img src="img/02.webp" alt="Tracker totals: July vs October 2026" loading="lazy"><figcaption><span class="t">Tracker totals: July vs October 2026</span><p>Tracked announced investment rose from $591.84B (Jul 25) to $1.00T (Oct 21); projects 136 to 265. AFT.</p><p><i>Announced | Data date: 2026-10-21</i></p><ul><li>Jul 25, 2026: tracker database showed $591.84B, 157,789 jobs, 136 projects (Announced) <a href="https://www.youtube.com/watch?v=bf0m2g7GYrI&amp;t=2600s">https://www.youtube.com/watch?v=bf0m2g7GYrI&amp;t=2600s</a></li><li>Oct 21, 2026: $1.00T, 208,058 jobs, 265 projects (Announced) <a href="https://americanfactorytracker.com/">https://americanfactorytracker.com/</a></li><li>Projects nearly doubled in under three months (Data, derived)</li></ul><p>Sources: <a href="https://americanfactorytracker.com/">https://americanfactorytracker.com/</a> <a href="https://www.youtube.com/watch?v=bf0m2g7GYrI&amp;t=2600s">https://www.youtube.com/watch?v=bf0m2g7GYrI&amp;t=2600s</a></p></figcaption></figure>
