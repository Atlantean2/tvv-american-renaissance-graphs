<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TechVestVentures American Renaissance Graphs — T8</title><link rel="stylesheet" href="../assets/style.css"><script>if(!/[?&]raw/.test(location.search))location.replace("../index.html#T8")</script></head><body><main id="issue"><h2 class="desk">8. Global Comparison</h2><figure class="g"><img src="img/20.webp" alt="Manufacturing share of GDP" loading="lazy"><figcaption><span class="t">Manufacturing share of GDP</span><p>Manufacturing value added 9.7% of GDP (Q2 2026), down from 13.1% in 2005. BEA via FRED.</p><p><i>Data | Data date: 2026-04</i></p><ul><li>2005: manufacturing 13.1% of GDP (Data) <a href="https://fred.stlouisfed.org/series/VAPGDPMA">https://fred.stlouisfed.org/series/VAPGDPMA</a></li><li>Q2 2026: 9.7% (Data) <a href="https://fred.stlouisfed.org/series/VAPGDPMA">https://fred.stlouisfed.org/series/VAPGDPMA</a></li><li>Share fell while output was flat: IPMAN averaged 99.3 in 2005, 99.4 in Sep 2026 (Data) <a href="https://fred.stlouisfed.org/series/VAPGDPMA">https://fred.stlouisfed.org/series/VAPGDPMA</a> <a href="https://fred.stlouisfed.org/series/IPMAN">https://fred.stlouisfed.org/series/IPMAN</a></li></ul><p>Sources: <a href="https://fred.stlouisfed.org/series/VAPGDPMA">https://fred.stlouisfed.org/series/VAPGDPMA</a></p></figcaption></figure>
<figure class="g"><img src="img/21.webp" alt="US vs China manufacturing" loading="lazy"><figcaption><span class="t">US vs China manufacturing</span><p>China manufacturing value added $4.82T (2025) vs US ~$2.94T. World Bank; BEA-derived US after 2021.</p><p><i>Data | Data date: 2025</i></p><ul><li>2025: China manufacturing value added $4.82T (Data) <a href="https://data.worldbank.org/indicator/NV.IND.MANF.CD">https://data.worldbank.org/indicator/NV.IND.MANF.CD</a></li><li>2025: US about $2.94T, BEA-derived (Data) <a href="https://fred.stlouisfed.org/series/VAPGDPMA">https://fred.stlouisfed.org/series/VAPGDPMA</a> <a href="https://fred.stlouisfed.org/series/GDP">https://fred.stlouisfed.org/series/GDP</a></li><li>China passed the US in 2010 ($1.92T vs $1.79T); gap $2.35T by 2021, last US World Bank year (Data) <a href="https://data.worldbank.org/indicator/NV.IND.MANF.CD">https://data.worldbank.org/indicator/NV.IND.MANF.CD</a></li></ul><p>Sources: <a href="https://data.worldbank.org/indicator/NV.IND.MANF.CD">https://data.worldbank.org/indicator/NV.IND.MANF.CD</a> <a href="https://fred.stlouisfed.org/series/VAPGDPMA">https://fred.stlouisfed.org/series/VAPGDPMA</a> <a href="https://fred.stlouisfed.org/series/GDP">https://fred.stlouisfed.org/series/GDP</a></p></figcaption></figure>
<figure class="g"><img src="img/23.webp" alt="Factory activity survey" loading="lazy"><figcaption><span class="t">Factory activity survey</span><p>Philadelphia Fed current activity +20.9 (Oct 2026); above zero means expansion. Regional proxy for ISM.</p><p><i>Data | Data date: 2026-10</i></p><ul><li>Oct 2026: Philadelphia Fed current activity +20.9 (Data) <a href="https://fred.stlouisfed.org/series/GACDFSA066MSFRBPHI">https://fred.stlouisfed.org/series/GACDFSA066MSFRBPHI</a></li><li>Above zero means expansion (Data) <a href="https://www.philadelphiafed.org/surveys-and-data/regional-economic-analysis/manufacturing-business-outlook-survey">https://www.philadelphiafed.org/surveys-and-data/regional-economic-analysis/manufacturing-business-outlook-survey</a></li><li>ISM PMI history is not open data, so TVV uses this regional survey as a proxy (Interpretation)</li></ul><p>Sources: <a href="https://fred.stlouisfed.org/series/GACDFSA066MSFRBPHI">https://fred.stlouisfed.org/series/GACDFSA066MSFRBPHI</a> <a href="https://www.philadelphiafed.org/surveys-and-data/regional-economic-analysis/manufacturing-business-outlook-survey">https://www.philadelphiafed.org/surveys-and-data/regional-economic-analysis/manufacturing-business-outlook-survey</a></p></figcaption></figure></main></body></html>
