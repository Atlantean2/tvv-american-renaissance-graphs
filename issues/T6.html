<figure class="g"><img src="img/27.webp" alt="Quarterly FDI Inflows 2014 to 2018 by Presidential Term" loading="lazy"><figcaption><span class="t">Quarterly FDI Inflows 2014 to 2018 by Presidential Term</span><p>FDI inflows peaked Q1 2015 at $956.6B annualized, driven by inversions like Medtronic–Covidien, not pledges.</p><ul><li>Peak Q1 2015 (Obama 2nd term): $956.6B SAAR, about $186B in the quarter (Data) <a href="https://www.bea.gov/news/2015/us-international-transactions-1st-quarter-2015-and-annual-revisions">https://www.bea.gov/news/2015/us-international-transactions-1st-quarter-2015-and-annual-revisions</a></li><li>Driver: inversions, mainly Medtronic–Covidien (Jan 26, 2015) (Data) same BEA release</li><li>2016 high $606.9B SAAR in Q2; Trump first year $283–394B (Data) <a href="https://fred.stlouisfed.org/series/ROWFDIQ027S">https://fred.stlouisfed.org/series/ROWFDIQ027S</a></li><li>Acquisitions about 97% of new FDI spending 2015–2017; new plants plus expansions only $9–14B a year (Data) <a href="https://www.bea.gov/data/intl-trade-investment/new-foreign-direct-investment-united-states">https://www.bea.gov/data/intl-trade-investment/new-foreign-direct-investment-united-states</a></li><li>No evidence SelectUSA pledges drove the peak (Interpretation)</li></ul></figcaption></figure></main></body></html>
