<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TechVestVentures American Renaissance Graphs — T6</title><link rel="stylesheet" href="../assets/style.css"><script>if(!/[?&]raw/.test(location.search))location.replace("../index.html#T6")</script></head><body><main id="issue"><h2 class="desk">6. Foreign Investment Flows</h2><figure class="g"><img src="img/13.webp" alt="New FDI actually spent" loading="lazy"><figcaption><span class="t">New FDI actually spent</span><p>BEA: 2025 new FDI first-year spending $232.2B (+49%); greenfield only $13.8B. Data through 2025 (released Jun 2026).</p><p><i>Data | Data date: 2025 (preliminary)</i></p><ul><li>Jun 2026 release: 2025 new FDI first-year spending $232.2B, +49% (Data) <a href="https://www.bea.gov/news/2026/new-foreign-direct-investment-united-states-2025">https://www.bea.gov/news/2026/new-foreign-direct-investment-united-states-2025</a></li><li>Greenfield plus expansions only $13.8B in 2025 (Data) <a href="https://www.bea.gov/news/2026/new-foreign-direct-investment-united-states-2025">https://www.bea.gov/news/2026/new-foreign-direct-investment-united-states-2025</a></li><li>Acquisitions are about 97% of spending 2015-2017 (Data) <a href="https://www.bea.gov/data/intl-trade-investment/new-foreign-direct-investment-united-states">https://www.bea.gov/data/intl-trade-investment/new-foreign-direct-investment-united-states</a></li></ul><p>Sources: <a href="https://www.bea.gov/data/intl-trade-investment/new-foreign-direct-investment-united-states/supplemental-data">https://www.bea.gov/data/intl-trade-investment/new-foreign-direct-investment-united-states/supplemental-data</a> <a href="https://www.bea.gov/news/2026/new-foreign-direct-investment-united-states-2025">https://www.bea.gov/news/2026/new-foreign-direct-investment-united-states-2025</a></p></figcaption></figure>
<figure class="g"><img src="img/14.webp" alt="FDI inflows, balance-of-payments basis" loading="lazy"><figcaption><span class="t">FDI inflows, balance-of-payments basis</span><p>FDI into the US ran $304B annualized in Q2 2026; 4-quarter average $310B. Fed Z.1 via FRED.</p><p><i>Data | Data date: 2026 Q2</i></p><ul><li>Q2 2026: FDI inflows $304B annualized (Data) <a href="https://fred.stlouisfed.org/series/ROWFDIQ027S">https://fred.stlouisfed.org/series/ROWFDIQ027S</a></li><li>4-quarter average $310B (Data) <a href="https://fred.stlouisfed.org/series/ROWFDIQ027S">https://fred.stlouisfed.org/series/ROWFDIQ027S</a></li><li>Q1 2015 peak $956.6B from corporate inversions (Data) <a href="https://www.bea.gov/news/2015/us-international-transactions-1st-quarter-2015-and-annual-revisions">https://www.bea.gov/news/2015/us-international-transactions-1st-quarter-2015-and-annual-revisions</a></li></ul><p>Sources: <a href="https://fred.stlouisfed.org/series/ROWFDIQ027S">https://fred.stlouisfed.org/series/ROWFDIQ027S</a></p></figcaption></figure>
<figure class="g"><img src="img/27.webp" alt="Quarterly FDI inflows 2014-2018 by presidential term" loading="lazy"><figcaption><span class="t">Quarterly FDI inflows 2014-2018 by presidential term</span><p>FDI inflows peaked Q1 2015 at $956.6B annualized, driven by inversions like Medtronic–Covidien, not pledges.</p><ul><li>Q1 2015 (Obama 2nd term): peak $956.6B SAAR, about $186B in the quarter (Data) <a href="https://www.bea.gov/news/2015/us-international-transactions-1st-quarter-2015-and-annual-revisions">https://www.bea.gov/news/2015/us-international-transactions-1st-quarter-2015-and-annual-revisions</a></li><li>Driver: inversions, notably Medtronic–Covidien, closed Jan 26, 2015 (Data) <a href="https://www.bea.gov/news/2015/us-international-transactions-1st-quarter-2015-and-annual-revisions">https://www.bea.gov/news/2015/us-international-transactions-1st-quarter-2015-and-annual-revisions</a></li><li>2016 high $606.9B SAAR in Q2; Trump first year $283–394B (Data) <a href="https://fred.stlouisfed.org/series/ROWFDIQ027S">https://fred.stlouisfed.org/series/ROWFDIQ027S</a></li><li>Acquisitions about 97% of new FDI spending 2015–2017; new plants plus expansions only $9–14B a year (Data) <a href="https://www.bea.gov/data/intl-trade-investment/new-foreign-direct-investment-united-states">https://www.bea.gov/data/intl-trade-investment/new-foreign-direct-investment-united-states</a></li><li>We found no source tying SelectUSA pledges to the peak; greenfield spending was too small to explain it (Interpretation, based on BEA above)</li></ul></figcaption></figure></main></body></html>
